spring.application.name=cpj

# Optional local overrides (gitignored) — copy credentials here
spring.config.import=optional:classpath:application-local.properties

# DataSource — defaults; override in application-local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/cpj_db

# create a local properties and add the following lines with your credentials
# spring.datasource.username=
# spring.datasource.password=

# JPA — Flyway owns the schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Safety: never let flyway clean drop the DB accidentally
spring.flyway.clean-disabled=true

# Judge0 — override callback-base-url with your LAN IP in application-local.properties
judge0.base-url=http://localhost:2358
judge0.callback-base-url=http://localhost:8080
# 5s: enough headroom for bits/stdc++.h compilation (~1.5s) + actual run time
judge0.cpu-time-limit=5
judge0.memory-limit-kb=262144
# Limit concurrent runs (compiles + submissions) sent to self-hosted Judge0 to avoid overload
judge0.max-concurrent-requests=5

# Logging
logging.file.name=/home/sajid/projects/judge/cpj/backend.log

# Enable Java 21 Virtual Threads
spring.threads.virtual.enabled=true

server.forward-headers-strategy=framework

# Multipart upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB